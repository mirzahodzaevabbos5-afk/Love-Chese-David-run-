<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1b2a5c"><title>LOVE CHASE</title>
<style>
:root{--bg:#78d0ff;--pn:#fff;--tx:#1b2a5c}

:root{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);touch-action:none;user-select:none;-webkit-user-select:none;font-family:"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;inset:0;pointer-events:none;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.scr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;gap:12px;padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px);color:#fff;text-align:center}
.scr.on{display:flex}.mid{justify-content:center}
h1{margin:18px 0 0;font-size:clamp(46px,15vw,84px);line-height:.88;color:#fff;letter-spacing:1px;-webkit-text-stroke:3px #1b2a5c;paint-order:stroke fill;text-shadow:0 6px 0 #1b2a5c}
h1 span{color:#ff4f9a;display:block}
.tag{font-size:20px;font-weight:900;color:#fff;text-shadow:0 2px 0 #1b2a5c,0 0 8px #1b2a5c;transform:rotate(-3deg);margin-top:6px}
h2{margin:6px 0;font-size:34px;text-shadow:0 3px 0 #1b2a5c}
.b{pointer-events:auto;border:0;border-radius:18px;padding:14px 30px;font:inherit;font-size:22px;color:#fff;background:linear-gradient(#ff6aa8,#e0207a);box-shadow:0 5px 0 #8f1050;cursor:pointer;min-width:200px}
.b:active{transform:translateY(4px);box-shadow:0 1px 0 #8f1050}
.b.o{background:linear-gradient(#ffb23e,#f07a00);box-shadow:0 5px 0 #9a4d00}
.b.u{background:linear-gradient(#4aa3ff,#1f62d6);box-shadow:0 5px 0 #123c8c}
.b.s{min-width:0;padding:8px 14px;font-size:16px}
.row{display:flex;gap:12px;pointer-events:none}.row .b{min-width:0;padding:14px 18px;font-size:24px}
.sp{flex:1}
.pan{background:rgba(255,255,255,.94);color:var(--tx);border-radius:22px;padding:14px;width:min(360px,92%);pointer-events:auto;box-sizing:border-box}
.tg{display:flex;justify-content:space-between;align-items:center;padding:12px 6px;font-size:20px;border-bottom:1px solid #0001}
.sw{width:56px;height:30px;border-radius:15px;background:#bbb;position:relative;cursor:pointer;transition:.2s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:#2fd35a}.sw.on:after{left:29px}
#sg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#eef4ff;border-radius:16px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:16px}

.chip{background:rgba(27,42,92,.8);border-radius:22px;padding:6px 14px;font-size:22px;color:#fff;min-width:60px}
#ps{pointer-events:auto;width:46px;height:46px;border:0;border-radius:14px;background:#2f7bff;color:#fff;font-size:22px;box-shadow:0 4px 0 #123c8c}

.big{font-size:54px;color:#ff4f9a;-webkit-text-stroke:2px #1b2a5c;paint-order:stroke fill;text-shadow:0 5px 0 #1b2a5c}
.stat{background:rgba(27,42,92,.78);border-radius:16px;padding:10px 24px;font-size:26px;min-width:180px}
ol{margin:0;padding-left:28px;text-align:left;font-size:22px}ol li{padding:5px 0}

const O=(o,m,l,x,z)=>{m.position.set(x,0,z||0);g.add(m);o.m=m;o.l=l;o.dead=0;r.obs.push(o)};
if(f==1)(Math.random()<.45+.3*dif?lanes:[lanes[Math.random()*2|0]]).forEach(l=>O({h:4,dz:3.3,hw:.95},mkTrain(),l,LX(l)));
if(f==2){const l=Math.random()*3|0;O({k:'r',h:4,dz:3.3,hw:.95,sp:9},mkTrain(),l,LX(l),-RW/2)}
if(f==3)for(const l of ls)O({h:1.1,dz:.45,hw:1},mkFence(),l,LX(l));
if(f==4)for(const l of ls)O({h:1.2,dz:.55,hw:1},mkJersey(),l,LX(l));
if(f==5)O({k:'b',h:0,dz:.5,hw:9},mkBar(),1,0);
if(i>=0){if(!coinRun&&Math.random()<.35){coinRun=3+(Math.random()*5|0);coinL=Math.random()*3|0}
if(coinRun>0){coinRun--;const bo=r.obs.filter(o=>o.l==coinL||o.k=='b');if(!bo.some(o=>o.h>3))for(let k=-1;k<=1;k++){const c=mkPick('c');c.position.set(LX(coinL),bo.length?2.1:.9,k*2.2);g.add(c);r.pk.push({t:'c',m:c})}}
else if(Math.random()<.07){const q=Math.random(),ty=q<.3?'m':q<.55?'d':q<.85?'b':'h',c=mkPick(ty),fl=f?free:Math.random()*3|0;c.position.set(LX(fl),1,0);g.add(c);r.pk.push({t:ty,m:c})}}}
let coinRun=0,coinL=1;
function updP(){while(rows[pidx+1]&&fwd(rows[pidx+1])<=RW/2)pidx++}
function fill(){while(!cornerRow&&gi-pidx<16){if(gi>8&&++since>nextC){mkRow(1);cornerRow=rows[gi-1];since=0;nextC=24+(Math.random()*16|0)}else mkRow(0)}}
function reset(){for(const k in rows)sc.remove(rows[k].g);rows={};gpx=0;gpz=RW*2;gth=0;gi=-2;th=camTh=0;dirs();bx=bz=vx=vz=0;pidx=-3;cornerRow=null;since=0;coinRun=0;px=py=vy=0;lane=1;gxs=gy=0;fill();updP();fill()}
function turn(d){const r=cornerRow,ox_=bx+Rx*px,oz_=bz+Rz*px;th+=d<0?Math.PI/2:-Math.PI/2;dirs();bx=r.pos[0];bz=r.pos[1];vx=ox_-(bx+Rx*px);vz=oz_-(bz+Rz*px);gpx=bx+Dx*RW;gpz=bz+Dz*RW;gth=th;cornerRow=null;pidx=r.i;sfx.lane();fill()}
/* ---------- state ---------- */
let gxs=0,gy=0,st='menu',px=0,py=0,vy=0,lane=1,tm=0,time=0,coinsRun=0,lives=0,mag=0,dbl=0,brg=0,inv=0,slide=0,shake=0,msg='',msgT=0,scoreV=0;
const scr=['menu','shop','rec','set','hud','pause','over'];
function show(...ids){scr.forEach(s=>$(s).classList.toggle('on',ids.includes(s)))}
function toMenu(){reset();st='menu';P.g.rotation.x=0;P.g.visible=G.g.visible=true;$('mc').textContent=S.coins;show('menu')}
function start(){au();reset();time=0;coinsRun=0;lives=0;mag=dbl=brg=inv=slide=shake=0;scoreV=0;P.g.rotation.x=0;st='play';show('hud')}
function hit(){st='caught';tm=0;sfx.hit();shake=.5}
function over(){st='over';const v=Math.floor(scoreV);S.best.push(v);S.best.sort((a,b)=>b-a);S.best=S.best.slice(0,5);S.coins+=coinsRun;save();$('os').textContent=v;$('ob').textContent=S.best[0];$('oc').textContent=coinsRun;$('tn').style.display='none';show('over')}
function jump(){if(st!='play')return;if(py<=.05){vy=15;sfx.jump();slide=0}else vy=-22}
function slid(){if(st!='play')return;if(py>.05)vy=-26;slide=.7;sfx.slide()}
function mv(d){if(st!='play')return;if(cornerRow){const z=fwd(cornerRow);if(z<9&&z>-2.8){turn(d);return}}const n=Math.max(0,Math.min(2,lane+d));if(n!=lane){lane=n;sfx.lane()}}
const cv=R.domElement;let sx=0,sy=0,sd=0;
cv.addEventListener('pointerdown',e=>{au();sx=e.clientX;sy=e.clientY;sd=1});
cv.addEventListener('pointermove',e=>{if(!sd)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.hypot(dx,dy)>26){sd=0;Math.abs(dx)>Math.abs(dy)?mv(dx>0?1:-1):(dy<0?jump():slid())}});
addEventListener('pointerup',()=>sd=0);
addEventListener('keydown',e=>{au();const k=e.key;if(k=='ArrowLeft'||k=='a')mv(-1);else if(k=='ArrowRight'||k=='d')mv(1);else if(k=='ArrowUp'||k=='w'||k==' ')jump();else if(k=='ArrowDown'||k=='s')slid();else if(k=='Escape')pause()});
function pause(){if(st=='play'){st='pause';show('pause')}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
const on=(id,f)=>$(id).addEventListener('click',()=>{au();f()});
on('play',start);on('again',start);on('ps',pause);on('res',()=>{st='play';show('hud')});
document.querySelectorAll('[data-m]').forEach(b=>b.addEventListener('click',()=>{au();toMenu()}));
on('bs',()=>{shop();show('shop')});
on('br',()=>{$('rl').innerHTML=(S.best.length?S.best:[0]).map(v=>`<li>${v}</li>`).join('');show('rec')});
on('bt',()=>{sw();show('set')});
function sw(){$('tm').classList.toggle('on',!!S.music);$('ts').classList.toggle('on',!!S.snd);$('tv').classList.toggle('on',!!S.vib)}
[['tm','music'],['ts','snd'],['tv','vib']].forEach(([id,k])=>on(id,()=>{S[k]=S[k]?0:1;save();sw();if(k=='vib'&&S.vib)vib(80);if(k=='snd')sfx.coin()}));
function shop(){const b=$('sg');b.innerHTML='';SK.forEach((k,i)=>{const d=document.createElement('div');d.className='card';const own=S.own.includes(i);d.innerHTML=`<i style="background:#${k.c.toString(16).padStart(6,'0')}"></i><b>${k.n}</b>`;
const bt=document.createElement('button');bt.className='b s';bt.textContent=S.skin==i?'✔ Выбрано':own?'Выбрать':'🪙 '+k.p;
bt.onclick=()=>{if(own)S.skin=i;else if(S.coins>=k.p){S.coins-=k.p;S.own.push(i);S.skin=i}else{bt.textContent='Мало монет';return}save();buildP();shop()};d.append(bt);b.append(d)});$('sc').textContent=S.coins}
/* ---------- loop ---------- */
const clk=new T.Clock();let t=0;
function movers(dt,trains){for(const k in rows){const r=rows[k];if(trains)for(const o of r.obs)if(o.k=='r'&&!o.dead)o.m.position.z+=o.sp*dt;
for(const d of r.mv){d.z+=d.v*dt;const H=RW/2+2;if(d.z>H)d.z-=2*H;else if(d.z<-H)d.z+=2*H;const a=Math.min(1,Math.max(.001,(H-Math.abs(d.z))/1.5));d.m.position.set(d.x,-.1,d.z);d.m.scale.setScalar(a);if(d.m.l){const s=Math.sin(t*9+d.x)*.6;d.m.l[0].rotation.x=s;d.m.l[1].rotation.x=-s}}}}
function loop(){requestAnimationFrame(loop);const dt=Math.min(.05,clk.getDelta());t+=dt;
if(st=='play')play(dt);else if(st=='caught')caught(dt);
if(st!='pause')movers(dt,st=='play');
camTh+=(th-camTh)*Math.min(1,dt*7);const cD=[-Math.sin(camTh),-Math.cos(camTh)],cR=[Math.cos(camTh),-Math.sin(camTh)];
const dk=Math.exp(-dt*7);vx*=dk;vz*=dk;const ox=bx+vx,oz=bz+vz,fr=(st=='menu'||st=='pause')?1:0;setView(P,fr);setView(G,fr);
const air=py>.1;
if(fr){P.want=G.want=0;run(P,t*11,1,0,dt);run(G,t*11,1,0,dt)}
else if(st=='play'){P.want=G.want=slide>0;gy+=(py-gy)*Math.min(1,dt*9);gxs+=(px-gxs)*Math.min(1,dt*6);run(P,t*(14+(brg>0?4:0)),air?.2:1,air,dt);run(G,t*13,1,gy>.25,dt)}
const gd=st=='play'?(brg>0?7:4):st=='caught'?Math.max(1.3,4-tm*5):3.4,gx=fr?1.3:gxs;
P.g.position.set(ox+cR[0]*px,py,oz+cR[1]*px);P.g.rotation.y=camTh;P.sh.position.y=-py+.03;P.g.visible=inv>0?Math.floor(t*14)%2==0:true;
G.g.position.set(ox-cD[0]*gd+cR[0]*gx,fr?0:gy,oz-cD[1]*gd+cR[1]*gx);G.g.rotation.y=camTh;G.sh.position.y=-(fr?0:gy)+.03;
ground.position.set(ox,-.5,oz);clouds.position.set(ox,0,oz);clouds.rotation.y=camTh;
if(fr){const a=Math.sin(t*.4)*.35,pw=P.g.position;cam.position.set(pw.x+cD[0]*5.6+cR[0]*(1.4+a),2.4,pw.z+cD[1]*5.6+cR[1]*(1.4+a));cam.lookAt(pw.x-cD[0]*1.5,1.5,pw.z-cD[1]*1.5)}
else{const sh=shake>0?(Math.random()-.5)*shake:0;cam.position.set(ox-cD[0]*11.5+cR[0]*px*.55+sh,5.3+py*.3+sh,oz-cD[1]*11.5+cR[1]*px*.55);cam.lookAt(ox+cD[0]*10+cR[0]*px*.4,1.4,oz+cD[1]*10+cR[1]*px*.4)}
shake=Math.max(0,shake-dt);R.render(sc,cam)}
function play(dt){time+=dt;const spd=(14+Math.min(9,time*.1))*(brg>0?1.6:1);
mag=Math.max(0,mag-dt);dbl=Math.max(0,dbl-dt);brg=Math.max(0,brg-dt);inv=Math.max(0,inv-dt);slide=Math.max(0,slide-dt);msgT=Math.max(0,msgT-dt);
bx+=Dx*spd*dt;bz+=Dz*spd*dt;scoreV+=spd*dt*.5*(dbl>0?2:1);
px+=(LX(lane)-px)*Math.min(1,dt*14);updP();fill();
for(const k in rows)if(rows[k].i<pidx-2){sc.remove(rows[k].g);delete rows[k]}
vy-=42*dt;py+=vy*dt;if(py<=0){py=0;vy=0}
if(cornerRow){const z=fwd(cornerRow);if(z<-2.8){hit();return}$('tn').style.display=z<32?'block':'none'}else $('tn').style.display='none';
for(const k in rows){const r=rows[k];if(r.i<pidx)continue;const c=Math.cos(r.th),s=Math.sin(r.th);
for(const o of r.obs){if(o.dead)continue;const m=o.m,wx=r.pos[0]+m.position.x*c+m.position.z*s,wz=r.pos[1]-m.position.x*s+m.position.z*c,rx=wx-bx,rz=wz-bz,lx=rx*Rx+rz*Rz,lf=rx*Dx+rz*Dz;
if(Math.abs(lf)<o.dz&&Math.abs(lx-px)<o.hw&&(o.k=='b'?(slide<=0&&py<1.6):py<o.h)){if(inv>0){}else if(lives>0){lives--;inv=2;o.dead=1;m.visible=false;shake=.3;sfx.hit()}else{hit();return}}}
for(const p of r.pk){if(p.got)continue;const m=p.m;let wx=r.pos[0]+m.position.x*c+m.position.z*s,wz=r.pos[1]-m.position.x*s+m.position.z*c,rx=wx-bx,rz=wz-bz,lx=rx*Rx+rz*Rz,lf=rx*Dx+rz*Dz;
if(mag>0&&p.t=='c'&&Math.abs(lf)<10&&Math.abs(lx-px)<6){const k2=Math.min(1,dt*9),dwx=(bx+Rx*px-wx)*k2,dwz=(bz+Rz*px-wz)*k2;m.position.x+=dwx*c-dwz*s;m.position.z+=dwx*s+dwz*c;m.position.y+=(py+.9-m.position.y)*k2;wx=r.pos[0]+m.position.x*c+m.position.z*s;wz=r.pos[1]-m.position.x*s+m.position.z*c;rx=wx-bx;rz=wz-bz;lx=rx*Rx+rz*Rz;lf=rx*Dx+rz*Dz}
m.rotation.y=t*3;
if(Math.abs(lf)<1.1&&Math.abs(lx-px)<1.1&&Math.abs(m.position.y-py-.9)<1.3){p.got=1;m.visible=false;
if(p.t=='c'){coinsRun++;scoreV+=10*(dbl>0?2:1);sfx.coin()}else{sfx.pow();vib(30);
if(p.t=='h'){lives=Math.min(3,lives+1);msg='❤️ +1 жизнь'}else if(p.t=='m'){mag=ITEM;msg='🧲 Магнит — 15 с'}else if(p.t=='d'){dbl=ITEM;msg='✖2 Очки ×2 — 15 с'}else{brg=ITEM;msg='🍔 Бургер: скорость ×1.6 — 15 с'}msgT=1.6}}}}
$('hc').textContent=coinsRun;$('hs').textContent=Math.floor(scoreV);$('hl').textContent='❤️'+lives;
const it=[];if(mag>0)it.push('🧲'+Math.ceil(mag));if(dbl>0)it.push('✖2 '+Math.ceil(dbl));if(brg>0)it.push('🍔'+Math.ceil(brg));
$('fx').textContent=msgT>0?msg:it.join('   ')}
function caught(dt){tm+=dt;P.g.rotation.x=Math.min(.9,P.g.rotation.x+dt*3);const cs=Math.max(0,6-tm*8);bx+=Dx*cs*dt;bz+=Dz*cs*dt;P.want=G.want=0;run(G,t*16,1,0,dt);if(tm>1.3)over()}
document.addEventListener('contextmenu',e=>e.preventDefault());
toMenu();loop();
</script></body></html>
